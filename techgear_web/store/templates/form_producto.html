{% extends "base.html" %}

{% block contenido %}
<div class="form-contenedor">
    <h2 class="form-titulo">{{ accion }} Producto</h2>
    
    <form method="POST" action="{% if id %}{% url 'editar_producto' id %}{% else %}{% url 'crear_producto' %}{% endif %}">
        {% csrf_token %}
        
        <div class="grupo-form">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" 
                   value="{% if producto %}{{ producto.nombre }}{% endif %}" required>
        </div>
        
        <div class="grupo-form">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="3" required>{% if producto %}{{ producto.descripcion }}{% endif %}</textarea>
        </div>
        
        <div class="grupo-form">
            <label for="precio">Precio</label>
            <input type="number" step="0.01" id="precio" name="precio" 
                   value="{% if producto %}{{ producto.precio }}{% endif %}" required>
        </div>
        
        <div class="grupo-form">
            <label for="cantidad">Cantidad en inventario</label>
            <input type="number" id="cantidad" name="cantidad" min="0"
                   value="{% if producto %}{{ producto.cantidad }}{% endif %}" required>
        </div>
        
        <div class="grupo-form">
            <label for="categoria">Categoría</label>
            <input type="text" id="categoria" name="categoria" 
                   value="{% if producto %}{{ producto.categoria }}{% endif %}" required>
        </div>
        
        <div class="grupo-form">
            <label for="imagen_url">URL de la imagen</label>
            <input type="url" id="imagen_url" name="imagen_url" 
                   value="{% if producto %}{{ producto.imagen_url }}{% endif %}" placeholder="https://ejemplo.com/imagen.jpg">
        </div>
        
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn-enviar flex-grow-1">✅ Guardar</button>
            <a href="{% url 'panel_admin' %}" class="btn btn-secondary flex-grow-1" style="text-align:center; text-decoration:none;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
