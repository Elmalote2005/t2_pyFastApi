<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ accion }} Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white py-5">
<div class="container">
    <h1 class="text-center mb-4">{{ accion }} Producto</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="POST" {% if id %}action="{% url 'editar_producto' id %}"{% endif %}>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control bg-dark text-white" 
                           value="{% if producto %}{{ producto.nombre }}{% endif %}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control bg-dark text-white" rows="3" required>{% if producto %}{{ producto.descripcion }}{% endif %}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number" step="0.01" name="precio" class="form-control bg-dark text-white" 
                           value="{% if producto %}{{ producto.precio }}{% endif %}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock" class="form-control bg-dark text-white" 
                           value="{% if producto %}{{ producto.stock }}{% endif %}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <input type="text" name="categoria" class="form-control bg-dark text-white" 
                           value="{% if producto %}{{ producto.categoria }}{% endif %}" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Imagen (ruta)</label>
                    <input type="text" name="imagen" class="form-control bg-dark text-white" 
                           value="{% if producto %}{{ producto.imagen }}{% endif %}" placeholder="/moto1.jpg">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">✅ Guardar</button>
                    <a href="{% url 'panel_admin' %}" class="btn btn-secondary flex-grow-1">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
