<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - TechGear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white min-vh-100 d-flex align-items-center">
    <div class="container" style="max-width: 450px;">
        <h1 class="text-center mb-4">📝 Crear Cuenta</h1>
        
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" name="nombre" class="form-control bg-dark text-white border-secondary" required minlength="3">
            </div>
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="correo" class="form-control bg-dark text-white border-secondary" required>
                <small class="text-muted">Usa @admin.com para ser administrador</small>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña (mínimo 6 caracteres)</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
            <a href="{% url 'login' %}" class="btn btn-outline-light w-100 mt-2">¿Ya tienes cuenta? Inicia sesión</a>
        </form>
    </div>
</body>
</html>
