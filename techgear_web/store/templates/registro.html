{% extends "base.html" %}

{% block contenido %}
<div class="form-contenedor">
    <h2 class="form-titulo">📝 Crear Cuenta</h2>
    
    {% if error %}
    <div class="mensaje-error">{{ error }}</div>
    {% endif %}
    
    <form action="{% url 'registro' %}" method="POST">
        {% csrf_token %}
        <div class="grupo-form">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
        </div>
        <div class="grupo-form">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
        </div>
        <div class="grupo-form">
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña segura" required>
        </div>
        <button type="submit" class="btn-enviar">Crear mi cuenta</button>
    </form>
    
    <p style="text-align:center;margin-top:1.5rem;color:var(--texto-claro);">
        ¿Ya tienes cuenta? <a href="{% url 'login' %}" style="color:var(--secundario);font-weight:600;text-decoration:none;">Inicia sesión aquí</a>
    </p>
</div>
{% endblock %}
