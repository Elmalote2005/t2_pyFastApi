{% extends "base.html" %}

{% block contenido %}
<div class="form-contenedor">
    <h2 class="form-titulo">🔐 Iniciar Sesión</h2>
    
    {% if error %}
    <div class="mensaje-error">{{ error }}</div>
    {% endif %}
    
    <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}
        <div class="grupo-form">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
        </div>
        <div class="grupo-form">
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn-enviar">Ingresar a mi cuenta</button>
    </form>
    
    <p style="text-align:center;margin-top:1.5rem;color:var(--texto-claro);">
        ¿No tienes cuenta? <a href="{% url 'registro' %}" style="color:var(--secundario);font-weight:600;text-decoration:none;">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
