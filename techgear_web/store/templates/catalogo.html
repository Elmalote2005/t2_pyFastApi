<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catalogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>🏍️ Catalogo de Motos</h1>
            <div>
                {% if usuario and usuario.rol == 'admin' %}
                <a href="{% url 'panel_admin' %}" class="btn btn-warning">⚙️ Panel Admin</a>
                {% endif %}
                <a href="{% url 'cerrar' %}" class="btn btn-outline-light ms-2">Cerrar Sesion</a>
            </div>
        </div>
        <div class="row g-4">
            {% for p in productos %}
            <div class="col-md-4">
                <div class="card bg-secondary text-white h-100">
                    <div class="card-body">
                        <h5 class="card-title">{{ p.nombre }}</h5>
                        <p class="card-text">{{ p.descripcion }}</p>
                        <p class="card-text fw-bold fs-5">${{ p.precio }}</p>
                        <p class="card-text">Stock: {{ p.stock }}</p>
                        <span class="badge bg-info">{{ p.categoria }}</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
