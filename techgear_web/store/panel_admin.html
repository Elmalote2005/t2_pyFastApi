<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administracion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container py-4">
    <h1 class="text-center mb-4">⚙️ Panel de Administracion</h1>
    
    <a href="{% url 'crear_producto' %}" class="btn btn-success mb-3">➕ Agregar Producto</a>
    <a href="{% url 'catalogo' %}" class="btn btn-secondary mb-3">← Volver al Catalogo</a>

    <div class="table-responsive">
        <table class="table table-dark table-striped">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripcion</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoria</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for p in productos %}
                <tr>
                    <td>{{ p.nombre }}</td>
                    <td>{{ p.descripcion }}</td>
                    <td>${{ "{:,}".format(p.precio) }}</td>
                    <td>{{ p.stock }}</td>
                    <td>{{ p.categoria }}</td>
                    <td>
                        <a href="{% url 'editar_producto' p._id %}" class="btn btn-sm btn-warning">✏️ Editar</a>
                        <a href="{% url 'eliminar_producto' p._id %}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar este producto?')">🗑️ Eliminar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
